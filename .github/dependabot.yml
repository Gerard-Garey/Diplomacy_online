# Mises à jour des actions GitHub épinglées par SHA. Chaque mise à jour arrive
# en pull request, passe la CI et n'est fusionnée que par le mainteneur (aucune
# fusion automatique). Les versions majeures sont ignorées : une montée
# majeure se décide à part.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "repo"
    labels:
      - "needs-triage"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
